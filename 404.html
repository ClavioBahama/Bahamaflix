<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Bahama Flix</title>
  <style>
    :root { --bg:#0b0b0f; --surface:#191922; --line:#2c2c38; --text:#f5f5f7; --muted:#a1a1ad; --accent:#e50914; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; text-align:center; padding:24px; }
    .box { max-width:480px; }
    .code { font-size:82px; font-weight:900; line-height:1; color:var(--accent); letter-spacing:-6px; }
    h1 { font-size:24px; margin:14px 0 8px; }
    p { color:var(--muted); margin:0 0 26px; }
    a { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 22px;
      background:var(--accent); color:#fff; border-radius:10px; font-weight:700; text-decoration:none; }
    a:hover { background:#ff1a26; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Esta página não existe</h1>
    <p>O endereço pode ter sido movido ou digitado incorretamente.</p>
    <a href="/#/">Voltar ao catálogo</a>
  </div>
</body>
</html>
